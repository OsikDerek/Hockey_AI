<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hockey AI 3D Viewer</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <div id="canvas-container"></div>

  <div id="ui-top">
    <div class="camera-controls">
      <button data-cam="topdown" class="active">Top-Down</button>
      <button data-cam="broadcast">Broadcast</button>
      <button data-cam="pov">POV</button>
      <select id="pov-player" disabled>
        <option value="">Pick player...</option>
      </select>
      <button id="quiz-toggle" class="quiz-btn">Quiz Mode</button>
    </div>
    <div class="data-info">
      <input type="file" id="file-picker" accept=".json" />
      <span id="data-status">No data loaded</span>
      <span id="quiz-score" class="hidden">0 / 0</span>
    </div>
  </div>

  <div id="ui-bottom">
    <button id="play-btn">Play</button>
    <div id="scrubber-wrap">
      <input type="range" id="scrubber" min="0" max="0" value="0" step="1" />
      <div id="event-markers"></div>
    </div>
    <span id="frame-counter">0 / 0</span>
    <span id="time-counter">0.00s</span>
    <select id="speed">
      <option value="0.5">0.5x</option>
      <option value="1" selected>1x</option>
      <option value="2">2x</option>
    </select>
  </div>

  <div id="event-tooltip" class="hidden"></div>
  <div id="active-event-banner" class="hidden"></div>
  <div id="pov-status" class="hidden">POV target off-screen</div>
  <div id="hud-counter">— / — visible</div>

  <!-- Quiz overlay: shown while playback is paused at a decision moment.
       The viewer fills #quiz-question + #quiz-choices when quiz.onPause fires. -->
  <div id="quiz-overlay" class="hidden">
    <div id="quiz-question">What would you do?</div>
    <div id="quiz-choices"></div>
    <div id="quiz-hint">Pick by click or hotkey · Esc to skip</div>
  </div>

  <!-- Reveal panel: shown briefly after the user commits a choice. -->
  <div id="quiz-reveal" class="hidden">
    <div id="quiz-reveal-result"></div>
    <div id="quiz-reveal-detail"></div>
    <div id="quiz-reveal-actions">
      <button id="quiz-replay-btn">Replay this play</button>
    </div>
  </div>

  <!-- End-of-clip scorecard: shown when playback finishes with quiz active. -->
  <div id="quiz-scorecard" class="hidden">
    <div id="quiz-scorecard-title">Quiz complete</div>
    <div id="quiz-scorecard-score"></div>
    <div id="quiz-scorecard-breakdown"></div>
    <button id="quiz-scorecard-restart">Restart quiz</button>
    <button id="quiz-scorecard-close">Close</button>
  </div>

  <!-- Surface JS errors visibly on the page; runs before the module loads
       so that even a parse error in viewer.js shows up in #data-status. -->
  <script>
    window.addEventListener("error", (e) => {
      const el = document.getElementById("data-status");
      if (el) el.textContent = `JS error: ${e.message} @ ${e.filename}:${e.lineno}:${e.colno}`;
    });
    window.addEventListener("unhandledrejection", (e) => {
      const el = document.getElementById("data-status");
      if (el) el.textContent = `Rejection: ${e.reason?.message ?? e.reason}`;
    });
  </script>
  <script type="module" src="viewer.js"></script>
</body>
</html>
